name: Service-Verzeichnis bauen

# Täglich ein Land, reihum (bei neun Ländern jedes alle 9 Tage); von Hand auch gezielt.
on:
  schedule:
    - cron: "0 2 * * *"   # täglich 02:00 UTC
  workflow_dispatch:
    inputs:
      countries:
        description: "Länder, z. B. \"de fr\" oder \"all\" (leer = Land des Tages)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      countries: ${{ steps.pick.outputs.countries }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          WANTED: ${{ github.event.inputs.countries }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, os
          from build_services import COUNTRIES
          wanted = os.environ.get("WANTED", "").split()
          if wanted == ["all"]:
              wanted = list(COUNTRIES)
          elif not wanted:
              day = datetime.date.today().toordinal()
              wanted = [list(COUNTRIES)[day % len(COUNTRIES)]]
          print("countries=" + json.dumps(wanted))
          PY

  country:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2          # Overpass schonen
      matrix:
        country: ${{ fromJson(needs.plan.outputs.countries) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build_services.py ${{ matrix.country }}
      - uses: actions/upload-artifact@v4
        with:
          name: services-${{ matrix.country }}
          path: site

  publish:
    needs: country
    if: always()
    runs-on: ubuntu-latest
    # Only publishing is serialized, so a long build doesn't block the other workflow.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: services-*
          merge-multiple: true
      - name: Zusammensetzen (übrige Länder aus der letzten Veröffentlichung)
        run: python3 publish.py artifacts site "https://choney34.github.io/nrg-data"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
