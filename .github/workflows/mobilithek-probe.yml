name: Mobilithek-Abo testen

# Ruft ein Mobilithek-Abonnement einmal ab und legt die Antwort als Artefakt ab (zum Entwickeln).
on:
  workflow_dispatch:
    inputs:
      subscription:
        description: "Abonnement-ID"
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Zertifikat vorbereiten
        env:
          P12: ${{ secrets.MOBILITHEK_CERT_P12 }}
          PASS: ${{ secrets.MOBILITHEK_CERT_PASSWORD }}
        run: |
          echo "$P12" | base64 -d > cert.p12
          openssl pkcs12 -in cert.p12 -passin env:PASS -nodes -out cert.pem 2>/dev/null \
            || openssl pkcs12 -legacy -in cert.p12 -passin env:PASS -nodes -out cert.pem
          openssl x509 -in cert.pem -noout -subject -enddate
      - name: Abrufen
        env:
          ID: ${{ github.event.inputs.subscription }}
        run: |
          B=https://mobilithek.info:8443/mobilithek/api
          for url in "$B/v1.0/subscription/$ID/clientPullService?subscriptionID=$ID" \
                     "$B/v1.0/subscription?subscriptionID=$ID" \
                     "$B/V1.0/subscription?subscriptionID=$ID"; do
            code=$(curl -s --cert cert.pem -H "Accept-Encoding: gzip" -D headers.txt -o body.gz -w "%{http_code}" "$url")
            type=$(grep -i '^content-type' headers.txt | tr -d '\r')
            echo "$code $type  ← ${url#$B}"
            if [ "$code" = 200 ] && ! echo "$type" | grep -qi html; then break; fi
          done
          (gunzip -c body.gz 2>/dev/null || cat body.gz) > body.txt
          wc -c body.txt; head -c 1500 body.txt; echo
          rm -f cert.p12 cert.pem
      - uses: actions/upload-artifact@v4
        with:
          name: mobilithek-${{ github.event.inputs.subscription }}
          path: body.txt
