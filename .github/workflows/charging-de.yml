name: Ladestandorte Deutschland bauen

# Ladesäulenregister der Bundesnetzagentur (monatlich aktualisiert), wöchentlich abgeholt.
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build_charging.py de
      - uses: actions/upload-artifact@v4
        with:
          name: charging-de
          path: site

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    # Only publishing is serialized, so a long build doesn't block the other workflow.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: charging-de
          merge-multiple: true
      - name: Zusammensetzen (übrige Dateien aus der letzten Veröffentlichung)
        run: python3 publish.py artifacts site "https://choney34.github.io/nrg-data"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
